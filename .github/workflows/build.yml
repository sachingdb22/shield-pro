name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create React Native project
        run: npx @react-native-community/cli@latest init SpamShield --package-name com.spamshield --skip-git-init
      - name: Add app code
        run: |
          cp App.tsx SpamShield/App.tsx
          cp native/*.kt SpamShield/android/app/src/main/java/com/spamshield/
          python3 patch.py
      - name: Build release APK
        working-directory: SpamShield/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpamShield-apk
          path: SpamShield/android/app/build/outputs/apk/release/app-release.apk
